# The version below and the `harlequin==` pin further down are one number:
# hsql ships with the Harlequin release it names. `release.yml` sets both --
# `uv version --project packaging/hsql` and `uv add --project packaging/hsql`,
# alongside the bump to Harlequin's own version -- and `test_packaging.py`
# fails if they ever disagree.
#
# Keep this comment here rather than above `version`: `uv version` rewrites
# that line and takes any comment attached to it along.

[project]

name = "hsql"
version = "2.11.0"
requires-python = ">=3.10"
description = "The headless SQL client for scripts and agents. Installs Harlequin."
authors = [
    { name = "Ted Conbeer", email = "tconbeer@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["sql", "cli", "harlequin", "agents", "headless"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# hsql is a metapackage: it ships no modules of its own, it just installs
# Harlequin. It is released with Harlequin and carries Harlequin's version
# number, so the pin is exact: hsql 2.9.0 *is* harlequin 2.9.0, and the number
# means the same thing whichever name you install by. An exact pin also keeps
# the entry point below honest -- it points into a module that only exists in
# releases that ship the `hsql` command.
dependencies = [
    "harlequin==2.11.0",
]


[project.scripts]

# The `harlequin` distribution provides this same script, from this same entry
# point -- so the two console scripts are byte-identical and whichever is
# written second is a no-op. Declaring it here anyway is what makes
# `uvx hsql --help` work without uv's "an executable named `hsql` is not
# provided by package `hsql`; consider `uvx --from harlequin hsql`" warning,
# which is the one install story this package exists to serve. The cost is that
# `pip uninstall hsql` takes the shared script with it and leaves an installed
# Harlequin without its `hsql` command; `pip install --force-reinstall
# harlequin` puts it back.
hsql = "harlequin.hsql:main"


[project.urls]

Homepage = "https://harlequin.sh"
Documentation = "https://harlequin.sh/docs/getting-started/index"
Repository = "https://github.com/tconbeer/harlequin"
"Bug Tracker" = "https://github.com/tconbeer/harlequin/issues"
Changelog = "https://github.com/tconbeer/harlequin/blob/main/CHANGELOG.md"


[build-system]

requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]

# there are no modules to ship; without this hatchling cannot infer a target.
bypass-selection = true
